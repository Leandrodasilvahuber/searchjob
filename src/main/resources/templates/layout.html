<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · SearchJob'">SearchJob</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f6f4fd; --card:#fff; --fg:#2a2740; --mut:#7a7894; --bd:#e6e2f3; --ac:#7c6cf2; --ok:#1f9d6a; --warn:#d9821c; --bad:#e5484d;
            --sombra:0 2px 12px rgb(92 76 180 / .08); --r:16px; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15141d; --card:#1e1c2a; --fg:#ebe9f5; --mut:#a3a0bd; --bd:#302d42; --ac:#a598ff; --ok:#4ade9a; --warn:#fbbf24; --bad:#ff7b7f;
            --sombra:0 2px 14px rgb(0 0 0 / .35); } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 "Nunito", ui-rounded, system-ui, sans-serif; }
    nav { display:flex; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; align-items:center; gap:2px; padding:8px 16px; background:color-mix(in srgb, var(--card) 88%, transparent);
          backdrop-filter:blur(8px); border-bottom:1px solid var(--bd); position:sticky; top:0; z-index:10; }
    nav .marca { font-weight:800; font-size:17px; margin-right:6px; color:var(--ac); white-space:nowrap; }
    nav a, nav .marca, nav form { flex:none; }
    nav a { color:var(--mut); text-decoration:none; padding:5px 10px; font-size:14px; white-space:nowrap; border-radius:999px; font-weight:600; transition:background .15s, color .15s; }
    nav a:hover { background:color-mix(in srgb, var(--ac) 10%, transparent); color:var(--fg); }
    nav a.on { background:var(--ac); color:#fff; box-shadow:0 2px 8px color-mix(in srgb, var(--ac) 40%, transparent); }
    nav .sair { padding:5px 9px; }
    .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
    nav .badge { background:var(--bad); color:#fff; border-radius:10px; padding:0 7px; font-size:12px; margin-left:4px; }
    main { max-width:1100px; margin:0 auto; padding:16px; }
    h1 { font-size:24px; font-weight:800; margin:8px 0 16px; }
    a { color:var(--ac); }
    .card { background:var(--card); border:1px solid var(--bd); border-radius:var(--r); padding:16px; margin-bottom:14px; box-shadow:var(--sombra); }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--bd); vertical-align:top; word-break:break-word; }
    th { color:var(--mut); font-weight:700; font-size:13px; }
    input, textarea, select, button { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--bd); border-radius:10px; padding:6px 10px; }
    input:focus, textarea:focus, select:focus { outline:2px solid color-mix(in srgb, var(--ac) 45%, transparent); outline-offset:1px; }
    textarea { width:100%; min-height:70px; } input[type=text], input[type=password] { width:100%; }
    button { cursor:pointer; background:var(--ac); color:#fff; border-color:var(--ac); border-radius:999px; padding:6px 14px; font-weight:700; transition:transform .1s, filter .15s; }
    button:hover { filter:brightness(1.07); } button:active { transform:scale(.97); }
    button.sec { background:transparent; color:var(--fg); border-color:var(--bd); }
    button.del { background:transparent; color:var(--bad); border-color:var(--bad); }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .tag { display:inline-block; padding:1px 10px; border-radius:999px; font-size:12px; font-weight:700; border:1px solid var(--bd); }
    .enviada,.ativa { color:var(--ok); } .pulada,.inativa { color:var(--mut); } .erro { color:var(--bad); }
    .pendente,.dry_run,.pendente_confirmacao,.aguardando_usuario { color:var(--warn); }
    .mut { color:var(--mut); } pre { white-space:pre-wrap; font-size:13px; max-height:220px; overflow:auto; }
    /* listas recolhidas (Situações, Textos da IA) */
  :root { --ia:#7c3aed; --resp:#0f766e; }
  @media (prefers-color-scheme: dark) { :root { --ia:#b794f6; --resp:#5eead4; } }
  .lead { margin:-8px 0 14px; }
  .tipos { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; }
  .tipos > div { border-left:3px solid var(--resp); padding:2px 0 2px 12px; }
  .tipos > div.ia { border-color:var(--ia); }
  .tipos p { margin:4px 0 0; font-size:14px; }
  .tipo { display:inline-block; padding:1px 9px; border-radius:10px; font-size:12px; font-weight:600; white-space:nowrap;
          color:var(--resp); background:color-mix(in srgb, var(--resp) 14%, transparent); }
  .tipo.ia { color:var(--ia); background:color-mix(in srgb, var(--ia) 14%, transparent); }

  .barra { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 0; margin-bottom:6px; }
  .barra input[type=search] { flex:1 1 240px; }
  .seg { display:inline-flex; border:1px solid var(--bd); border-radius:8px; overflow:hidden; }
  .seg button { background:transparent; color:var(--fg); border:0; border-radius:0; padding:6px 12px; }
  .seg button + button { border-left:1px solid var(--bd); }
  .seg button.on { background:var(--ac); color:#fff; }
  .seg .n { opacity:.7; font-size:12px; margin-left:4px; }

  details.item { color:var(--fg); background:var(--card); border:1px solid var(--bd); border-left:3px solid var(--resp); border-radius:10px; margin-bottom:8px; }
  details.item.ia { border-left-color:var(--ia); }
  details.item.inativa { opacity:.65; }
  details.item[open] { opacity:1; box-shadow:0 2px 10px rgb(0 0 0 / .08); }
  details.item > summary { list-style:none; cursor:pointer; padding:10px 14px; display:grid;
                           grid-template-columns:auto 1fr auto; gap:4px 12px; align-items:start; }
  details.item > summary::-webkit-details-marker { display:none; }
  details.item > summary:hover { background:color-mix(in srgb, var(--ac) 5%, transparent); border-radius:10px; }
  .perg { font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .resp { grid-column:2; font-size:14px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .resp b { color:var(--resp); }
  .lado { grid-column:3; grid-row:1 / span 2; text-align:right; white-space:nowrap; font-size:13px; }
  .corpo { padding:4px 14px 14px; border-top:1px solid var(--bd); }
  .corpo label { display:block; font-size:13px; font-weight:600; color:var(--mut); margin:10px 0 4px; }
  .corpo .ajuda { font-weight:400; }
  .corpo pre.texto { font:inherit; max-height:none; margin:0; padding:10px 12px; border-radius:8px; background:var(--bg); }
  .ultimo { border:1px dashed var(--bd); border-radius:8px; padding:8px 10px; margin-top:10px; }
  .ultimo pre { margin:6px 0 0; }
  .acoes { margin-top:10px; justify-content:space-between; }
  details.novo > summary { cursor:pointer; font-weight:600; color:var(--ac); }
  .vazio { text-align:center; padding:30px; }
  @media (max-width:600px) {
    details.item > summary { grid-template-columns:1fr; }
    .resp { grid-column:1; } .lado { grid-column:1; grid-row:auto; text-align:left; }
  }
    .chamando { border-color:var(--warn); border-radius:var(--r); background:color-mix(in srgb, var(--warn) 12%, var(--card)); }
  </style>
</head>
<body>
<nav th:fragment="menu(pagina)">
  <span class="marca">📄 SearchJob</span>
  <a th:href="@{/}" th:classappend="${pagina=='painel'} ? 'on'">🏠 Painel</a>
  <a th:href="@{/pendencias}" th:classappend="${pagina=='pendencias'} ? 'on'">🔔 Pendências</a>
  <a th:href="@{/historico}" th:classappend="${pagina=='historico'} ? 'on'">📜 Histórico</a>
  <a th:href="@{/situacoes}" th:classappend="${pagina=='situacoes'} ? 'on'">🧩 Situações</a>
  <a th:href="@{/textos}" th:classappend="${pagina=='textos'} ? 'on'">✨ Textos da IA</a>
  <a th:href="@{/cvs}" th:classappend="${pagina=='cvs'} ? 'on'">📄 CVs</a>
  <a th:href="@{/cadastros}" th:classappend="${pagina=='cadastros'} ? 'on'">🏢 Cadastros</a>
  <a th:href="@{/portais}" th:classappend="${pagina=='portais'} ? 'on'">🔑 Portais e IA</a>
  <a th:href="@{/prompts}" th:classappend="${pagina=='prompts'} ? 'on'">🧠 Prompts dos modelos</a>
  <a th:href="@{/kv/dado_fixo}" th:classappend="${pagina=='dado_fixo'} ? 'on'">📌 Dados fixos</a>
  <a th:href="@{/kv/preferencia}" th:classappend="${pagina=='preferencia'} ? 'on'">💜 Preferências</a>
  <a th:href="@{/kv/config}" th:classappend="${pagina=='config'} ? 'on'">⚙️ Configuração</a>
  <form th:action="@{/encerrar}" method="post" style="margin-left:auto; padding-left:6px"
        onsubmit="return confirm('Encerrar o SearchJob? A sessão em andamento será parada, o Firefox do robô fechado e o serviço sairá da memória.')">
    <button class="del sair" title="Encerrar serviço: para a sessão, fecha o Firefox do robô e derruba o serviço">🔌<span class="sr">Encerrar serviço</span></button>
  </form>
</nav>
</body>
</html>
