<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout :: head('Histórico')}"></head>
<body>
<nav th:replace="~{layout :: menu(${pagina})}"></nav>
<main>
  <h1>Histórico de vagas</h1>
  <form class="row card" method="get" th:action="@{/historico}">
    <input type="text" name="portal" th:value="${portal}" placeholder="portal (ex.: Gupy)" style="width:180px">
    <select name="status">
      <option value="">todos os status</option>
      <option th:each="o : ${ {'enviada','pulada','erro','pendente','dry_run','aguardando_usuario'} }" th:value="${o}" th:text="${o}" th:selected="${o==status}"></option>
    </select>
    <button>Filtrar</button>
    <span class="mut" th:text="${itens.size()} + ' vaga(s)'"></span>
  </form>
  <div class="card" style="overflow-x:auto">
    <table>
      <tr><th>Data</th><th>Empresa</th><th>Cargo</th><th>Portal</th><th>CV</th><th>Status</th><th>Motivo</th><th></th></tr>
      <tr th:each="c : ${itens}">
        <td th:text="${c.data}"></td>
        <td th:text="${c.empresa}"></td>
        <td><a th:if="${c.url != null and c.url.startsWith('http')}" th:href="${c.url}" target="_blank" rel="noopener" th:text="${c.cargo}"></a><span th:unless="${c.url != null and c.url.startsWith('http')}" th:text="${c.cargo}"></span></td>
        <td th:text="${c.portal}"></td>
        <td th:text="${c.cvUsado}"></td>
        <td><span class="tag" th:classappend="${c.status}" th:text="${c.status}"></span></td>
        <td th:text="${#strings.abbreviate(c.motivo, 90)}"></td>
        <td><form th:action="@{/historico/{id}/excluir(id=${c.id})}" method="post"><button class="del" onclick="return confirm('Excluir?')">×</button></form></td>
      </tr>
    </table>
  </div>
</main>
</body>
</html>
